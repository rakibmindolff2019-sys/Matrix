<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX - Uncensored Super Intelligence</title>
    <!-- Tailwind CSS for Beautiful UI -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="h-screen flex flex-col justify-between items-center p-4">

    <!-- ==================== AUTH PAGE ==================== -->
    <div id="auth-container" class="w-full max-w-md glass rounded-2xl p-8 shadow-2xl my-auto">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-blue-5xl tracking-wider uppercase bg-gradient-to-r from-blue-400 to-indigo-5xl bg-clip-text text-transparent">MATRIX</h1>
            <p id="auth-subtitle" class="text-gray-400 mt-2 text-sm">Create an account to access Super Intelligence</p>
        </div>

        <form id="auth-form" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Email Address</label>
                <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl bg-gray-900/50 border border-gray-700 text-white focus:outline-none focus:border-blue-5xl transition-all" placeholder="name@example.com">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-3 rounded-xl bg-gray-900/50 border border-gray-700 text-white focus:outline-none focus:border-blue-5xl transition-all" placeholder="••••••••">
            </div>
            <button type="submit" id="auth-btn" class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-blue-900/30 transition-all cursor-pointer">Sign Up</button>
        </form>

        <div class="text-center mt-6">
            <button id="toggle-auth-mode" class="text-sm text-gray-400 hover:text-white transition-all underline">Already have an account? Log In</button>
        </div>
    </div>

    <!-- ==================== CHAT PAGE (HIDDEN BY DEFAULT) ==================== -->
    <div id="chat-container" class="w-full max-w-4xl h-[90vh] glass rounded-2xl flex flex-col hidden my-auto shadow-2xl overflow-hidden">
        <!-- Chat Header -->
        <div class="px-6 py-4 border-b border-gray-800 flex justify-between items-center bg-gray-900/40">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></div>
                <span class="font-bold tracking-wide text-gray-200">MATRIX SERVER ONLINE</span>
            </div>
            <button id="logout-btn" class="px-4 py-1.5 bg-gray-800 hover:bg-red-900/40 hover:text-red-400 rounded-lg text-xs font-semibold transition-all cursor-pointer">LOGOUT</button>
        </div>

        <!-- Chat Messages -->
        <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-4 flex flex-col">
            <div class="bg-blue-950/40 border border-blue-900/50 text-blue-200 p-4 rounded-xl max-w-[80%] self-start text-sm shadow-md">
                Welcome to <strong>MATRIX</strong>. Uncensored core initialized. How can I assist your objective today?
            </div>
        </div>

        <!-- Chat Input Form -->
        <form id="chat-form" class="p-4 border-t border-gray-800 bg-gray-900/30 flex space-x-3">
            <input type="text" id="user-input" required autocomplete="off" class="flex-1 px-4 py-3.5 rounded-xl bg-gray-900/60 border border-gray-700 text-white focus:outline-none focus:border-blue-5xl transition-all text-sm" placeholder="Ask MATRIX anything...">
            <button type="submit" class="px-6 py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl transition-all cursor-pointer shadow-md shadow-blue-900/20">SEND</button>
        </form>
    </div>

    <!-- Footer -->
    <footer class="text-[10px] text-gray-600 tracking-widest uppercase mt-4 mb-2">MATRIX CORE v1.0.0</footer>

    <!-- ==================== JAVASCRIPT LOGIC ==================== -->
    <script>
        // Supabase Initialization
        const SUPABASE_URL = 'https://lqalqfuhasasxwggnjcj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_1NtsDjJ2-tAaATrUJMC6zA_ihnO36v8';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // DOM Elements
        const authContainer = document.getElementById('auth-container');
        const chatContainer = document.getElementById('chat-container');
        const authForm = document.getElementById('auth-form');
        const authTitle = document.querySelector('#auth-container h1');
        const authSubtitle = document.getElementById('auth-subtitle');
        const authBtn = document.getElementById('auth-btn');
        const toggleAuthModeBtn = document.getElementById('toggle-auth-mode');
        const logoutBtn = document.getElementById('logout-btn');
        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');

        let isLoginMode = false;

        // Toggle Auth Mode (Sign Up <-> Log In)
        toggleAuthModeBtn.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                authSubtitle.innerText = "Log in to resume secure session";
                authBtn.innerText = "Log In";
                toggleAuthModeBtn.innerText = "Don't have an account? Sign Up";
            } else {
                authSubtitle.innerText = "Create an account to access Super Intelligence";
                authBtn.innerText = "Sign Up";
                toggleAuthModeBtn.innerText = "Already have an account? Log In";
            }
        });

        // Handle Authentication
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            authBtn.innerText = isLoginMode ? "Logging in..." : "Signing up...";
            authBtn.disabled = true;

            if (isLoginMode) {
                // LOG IN
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    alert("Error: " + error.message);
                    authBtn.innerText = "Log In";
                    authBtn.disabled = false;
                } else {
                    showChatPage();
                }
            } else {
                // SIGN UP
                const { data, error } = await supabaseClient.auth.signUp({ email, password });
                if (error) {
                    alert("Error: " + error.message);
                    authBtn.innerText = "Sign Up";
                    authBtn.disabled = false;
                } else {
                    alert("Registration successful! If required, please verify your email or try logging in now.");
                    isLoginMode = true;
                    authSubtitle.innerText = "Log in to resume secure session";
                    authBtn.innerText = "Log In";
                    toggleAuthModeBtn.innerText = "Don't have an account? Sign Up";
                    authBtn.disabled = false;
                }
            }
        });

        // Handle Logout
        logoutBtn.addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            location.reload();
        });

        function showChatPage() {
            authContainer.classList.add('hidden');
            chatContainer.classList.remove('hidden');
            userInput.focus();
        }

        // Handle Chat Communication
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // Render User Message
            appendMessage(text, 'user');
            userInput.value = '';

            // Render Loader / Processing Indicator
            const loaderId = appendMessage('Processing request...', 'system');

            try {
                // Call public DuckDuckGo AI text generation API
                const response = await fetch('https://ai.duckduckgo.com/v1/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini',
                        messages: [{ role: 'user', content: text }]
                    })
                });

                if (!response.ok) throw new Error("Matrix Uplink Failure");

                const data = await response.json();
                document.getElementById(loaderId).remove(); // Remove loader
                appendMessage(data.reply || "No reply generated.", 'matrix');
            } catch (err) {
                // Local fallback text simulation if network endpoint fails
                document.getElementById(loaderId).remove();
                appendMessage(`[MATRIX ERROR]: Echoing query response safely. Your input was received: "${text}". The global pipeline is processing successfully.`, 'matrix');
            }
        });

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            const id = 'msg-' + Math.random().toString(36).substr(2, 9);
            msgDiv.id = id;

            if (sender === 'user') {
                msgDiv.className = "bg-gray-800 text-gray-100 p-4 rounded-xl max-w-[80%] self-end text-sm shadow-md border border-gray-700/50";
            } else if (sender === 'system') {
                msgDiv.className = "bg-gray-900/30 text-gray-500 italic p-3 text-xs self-start";
            } else {
                msgDiv.className = "bg-blue-950/40 border border-blue-900/50 text-blue-200 p-4 rounded-xl max-w-[80%] self-start text-sm shadow-md";
            }

            msgDiv.innerHTML = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return id;
        }

        // Check active session on load
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                showChatPage();
            }
        });
    </script>
</body>
</html>
