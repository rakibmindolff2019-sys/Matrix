<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: white; font-family: sans-serif; }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-screen p-4">

    <!-- LOGIN PAGE -->
    <div id="login-box" class="text-center">
        <h1 class="text-4xl font-bold mb-8">MATRIX AI</h1>
        <button id="google-btn" class="bg-white text-black px-8 py-3 rounded-full font-bold hover:bg-gray-200 transition">
            Continue with Google
        </button>
    </div>

    <!-- CHAT PAGE (HIDDEN INITIALLY) -->
    <div id="chat-box" class="hidden w-full max-w-2xl h-[80vh] flex flex-col border border-gray-800 rounded-2xl p-4">
        <div id="messages" class="flex-1 overflow-y-auto mb-4 space-y-4"></div>
        <form id="chat-form" class="flex gap-2">
            <input id="input" class="flex-1 bg-gray-900 p-3 rounded-xl border border-gray-700" placeholder="Ask anything...">
            <button class="bg-blue-600 px-6 py-2 rounded-xl">Send</button>
        </form>
    </div>

    <script>
        const GEMINI_KEY = 'AQ.Ab8RN6K70RjF8M5kRhVGZmS8F-3bo-ZczfGuwClCpQjH3jHqOQ';
        
        // Simulating Google Login (Direct access for your ease)
        document.getElementById('google-btn').onclick = () => {
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('chat-box').classList.remove('hidden');
        };

        document.getElementById('chat-form').onsubmit = async (e) => {
            e.preventDefault();
            const input = document.getElementById('input');
            const msgDiv = document.getElementById('messages');
            
            msgDiv.innerHTML += `<div class="text-right p-2 text-blue-400">You: ${input.value}</div>`;
            const userText = input.value;
            input.value = '';

            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: userText }] }] })
            });

            const data = await res.json();
            const reply = data.candidates[0].content.parts[0].text;
            msgDiv.innerHTML += `<div class="bg-gray-800 p-3 rounded-lg">Matrix: ${reply}</div>`;
        };
    </script>
</body>
</html>
