<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #131314; color: white; font-family: 'Segoe UI', sans-serif; }
        .chat-bg { background-color: #1e1f20; }
        .user-msg { background-color: #282a2d; }
        .ai-msg { background-color: transparent; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Header -->
    <header class="p-4 border-b border-gray-700 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-tight">MATRIX <span class="text-gray-500">Flash-Lite</span></h1>
    </header>

    <!-- Chat Area -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-6">
        <div class="ai-msg p-4 rounded-lg">Hello Rakib, I am MATRIX. How can I help you today?</div>
    </div>

    <!-- Input Area -->
    <div class="p-4">
        <div class="chat-bg rounded-full flex items-center p-2 border border-gray-600">
            <input id="user-input" class="flex-1 bg-transparent p-2 outline-none" placeholder="Ask MATRIX anything...">
            <button id="send-btn" class="bg-blue-600 p-2 rounded-full w-10 h-10">↑</button>
        </div>
    </div>

    <script>
        const API_KEY = 'AQ.Ab8RN6Kz8Q0rHp9atkvKT6FgxVHz1_VfSzpr6kVQ2hJxIkmeAg';
        const chatContainer = document.getElementById('chat-container');
        const input = document.getElementById('user-input');
        const btn = document.getElementById('send-btn');

        btn.onclick = async () => {
            const text = input.value;
            if(!text) return;
            chatContainer.innerHTML += `<div class="user-msg p-4 rounded-lg self-end">You: ${text}</div>`;
            input.value = '';

            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
            });
            const data = await res.json();
            const reply = data.candidates[0].content.parts[0].text;
            chatContainer.innerHTML += `<div class="ai-msg p-4 rounded-lg">MATRIX: ${reply.replace(/\n/g, '<br>')}</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        };
    </script>
</body>
</html>
