<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center p-4">

    <!-- চ্যাট উইন্ডো -->
    <div id="chat-box" class="w-full max-w-2xl bg-gray-900 border border-gray-800 rounded-2xl p-6 h-[80vh] overflow-y-auto space-y-4 shadow-2xl">
        <div class="text-gray-400 italic">MATRIX system initialized...</div>
    </div>

    <!-- ইনপুট এরিয়া -->
    <div class="w-full max-w-2xl mt-4 flex gap-2">
        <input id="user-input" class="flex-1 bg-gray-900 border border-gray-700 p-4 rounded-xl outline-none focus:border-blue-500" placeholder="Ask MATRIX anything...">
        <button id="send-btn" class="bg-blue-600 px-8 py-4 rounded-xl font-bold hover:bg-blue-500 transition">SEND</button>
    </div>

    <script>
        const API_KEY = 'AQ.Ab8RN6Kz8Q0rHp9atkvKT6FgxVHz1_VfSzpr6kVQ2hJxIkmeAg';
        const chatBox = document.getElementById('chat-box');
        const input = document.getElementById('user-input');
        const btn = document.getElementById('send-btn');

        btn.onclick = async () => {
            const message = input.value.trim();
            if (!message) return;

            // ইউজার মেসেজ
            chatBox.innerHTML += `<div class="text-right text-blue-300">You: ${message}</div>`;
            input.value = '';

            try {
                // আমার নিজস্ব এআই মডেলের সাথে কানেক্ট করার রিকোয়েস্ট
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: message }] }] })
                });

                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;

                // এআই রিপ্লাই
                chatBox.innerHTML += `<div class="text-gray-100">MATRIX: ${reply.replace(/\n/g, '<br>')}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                chatBox.innerHTML += `<div class="text-red-500">Error: Connection failed. Check VPN/Internet.</div>`;
            }
        };
    </script>
</body>
</html>
