<!DOCTYPE html>
<html>
<head>
    <title>MATRIX AI</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 95vh; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; }
        .msg { margin-bottom: 15px; }
        #input-area { display: flex; padding: 10px; }
        input { flex: 1; padding: 10px; background: #222; color: #fff; border: 1px solid #444; }
    </style>
</head>
<body>
    <div id="chat"></div>
    <div id="input-area">
        <input id="txt" placeholder="Ask anything...">
        <button onclick="send()">Send</button>
    </div>

    <script>
        async function send() {
            const txt = document.getElementById('txt').value;
            const chat = document.getElementById('chat');
            chat.innerHTML += `<div class="msg"><b>You:</b> ${txt}</div>`;
            
            // তোমার API Key নিচে এখানে আছে
            const key = 'AQ.Ab8RN6K70RjF8M5kRhVGZmS8F-3bo-ZczfGuwClCpQjH3jHqOQ';
            
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: txt }] }] })
                });
                const data = await res.json();
                const reply = data.candidates[0].content.parts[0].text;
                chat.innerHTML += `<div class="msg"><b>AI:</b> ${reply}</div>`;
            } catch (e) {
                chat.innerHTML += `<div class="msg" style="color:red">Error: চেক করো ভিপিএন অন আছে কি না।</div>`;
            }
        }
    </script>
</body>
</html>
