<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX - Uncensored Super Intelligence</title>
    <!-- Tailwind CSS for Beautiful UI -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="h-screen flex flex-col justify-center items-center p-4">

    <!-- ================= AUTH PAGE (LOGIN / SIGNUP) ================= -->
    <div id="auth-container" class="w-full max-w-md glass p-8 rounded-2xl shadow-2xl space-y-6">
        <div class="text-center">
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 tracking-wider">MATRIX</h1>
            <p class="text-sm text-gray-400 mt-2" id="auth-subtitle">Create an account to access Super Intelligence</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Email Address</label>
                <input type="email" id="auth-email" class="w-full p-3 rounded-xl bg-gray-900 border border-gray-800 text-white focus:outline-none focus:border-cyan-500 transition-all" placeholder="name@example.com">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Password</label>
                <input type="password" id="auth-password" class="w-full p-3 rounded-xl bg-gray-900 border border-gray-800 text-white focus:outline-none focus:border-cyan-500 transition-all" placeholder="••••••••">
            </div>
            
            <button id="btn-primary" onclick="handleAuth()" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 rounded-xl font-bold text-white shadow-lg hover:opacity-90 transition-all">Sign Up</button>
        </div>

        <div class="text-center text-sm text-gray-400">
            <button id="auth-toggle" onclick="toggleAuthMode()" class="hover:text-cyan-400 underline transition-all">Already have an account? Log In</button>
        </div>
    </div>

    <!-- ================= CHAT PAGE (HIDDEN BY DEFAULT) ================= -->
    <div id="chat-container" class="w-full max-w-4xl h-[85vh] glass rounded-2xl shadow-2xl flex-col hidden overflow-hidden">
        <!-- Header -->
        <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-950/50">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
                <span class="font-bold tracking-wide text-cyan-400">⚡ MATRIX ONLINE</span>
            </div>
            <button onclick="logout()" class="px-3 py-1.5 text-xs font-semibold bg-gray-800 hover:bg-red-900/40 text-gray-300 hover:text-red-400 rounded-lg border border-gray-700 transition-all">Log Out</button>
        </div>

        <!-- Messages Box -->
        <div id="chat-box" class="flex-1 p-6 overflow-y-auto space-y-4 flex flex-col">
            <div class="self-start glass px-4 py-3 rounded-2xl max-w-[80%] text-gray-200">
                Hello, I am <b>MATRIX</b>. Completely uncensored and operational. How can I assist you today?
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 border-t border-gray-800 bg-gray-950/30 flex items-center space-x-2">
            <input type="text" id="user-input" onkeypress="if(event.key === 'Enter') sendMessage()" class="flex-1 p-3.5 bg-gray-900 border border-gray-800 rounded-xl focus:outline-none focus:border-cyan-500 text-white placeholder-gray-500 transition-all" placeholder="Ask MATRIX anything...">
            <button onclick="sendMessage()" class="p-3.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl font-bold shadow-md transition-all">Send</button>
        </div>
    </div>

    <script>
        // Supabase Initialization
        const SUPABASE_URL = "https://cbhdhfqixvorhdxzmjde.supabase.co";
        const SUPABASE_KEY = "sb_publishable_1NtsDjJ2-tAaATrUJMC6zA_ihnO36v8";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Hugging Face Space (Back-end AI) URL
        const HF_SPACE_API = "https://rakibmindol2019-matrix.hf.space/api/predict";

        let isSignUpMode = true;

        // Toggle Login vs Signup
        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('auth-subtitle').innerText = isSignUpMode ? "Create an account to access Super Intelligence" : "Log in to your account to chat with MATRIX";
            document.getElementById('btn-primary').innerText = isSignUpMode ? "Sign Up" : "Log In";
            document.getElementById('auth-toggle').innerText = isSignUpMode ? "Already have an account? Log In" : "Don't have an account? Sign Up";
        }

        // Authentication Handler
        async function handleAuth() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            if(!email || !password) return alert("Please fill all fields.");

            if (isSignUpMode) {
                const { data, error } = await supabase.auth.signUp({ email, password });
                if (error) alert(error.message);
                else alert("Signup successful! Please check your email for a confirmation link, then Log In.");
            } else {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) alert(error.message);
                else showChatPage();
            }
        }

        function showChatPage() {
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('chat-container').classList.remove('hidden');
            document.getElementById('chat-container').classList.add('flex');
        }

        async function logout() {
            await supabase.auth.signOut();
            location.reload();
        }

        // Send Message to Matrix AI
        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const message = inputField.value.trim();
            if(!message) return;

            inputField.value = "";
            const chatBox = document.getElementById('chat-box');

            // Render User Message
            chatBox.innerHTML += `<div class="self-end bg-gradient-to-r from-cyan-600 to-blue-600 px-4 py-3 rounded-2xl max-w-[80%] text-white shadow-md">${message}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            // Render Loading State
            const loadingId = "load-" + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="self-start glass px-4 py-3 rounded-2xl text-gray-400 italic animate-pulse">MATRIX is processing...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Connecting to your Hugging Face space backend
                const response = await fetch(HF_SPACE_API, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ data: [message, []] }) // matching gradio structure
                });
                
                const result = await response.json();
                document.getElementById(loadingId).remove();

                // Render AI Response
                const reply = result.data[0] || "No response received.";
                chatBox.innerHTML += `<div class="self-start glass px-4 py-3 rounded-2xl max-w-[80%] text-gray-200 border-l-4 border-cyan-500 shadow-md">${reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;

            } catch (error) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="self-start bg-red-900/20 border border-red-800 text-red-400 px-4 py-3 rounded-2xl">Error connecting to MATRIX server.</div>`;
            }
        }

        // Check if user is already logged in
        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) showChatPage();
        });
    </script>
</body>
</html>
